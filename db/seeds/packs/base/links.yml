# Base navigation links
# These are standard navigation items used across all packs
# NOTE: link_path is required for the navigation to render properly
# Titles are multilingual (link_title_<locale>) so sites render correctly
# in their configured locale (same format as db/yml_seeds/links.yml).

# Top Navigation
- slug: top_nav_home
  page_slug: home
  link_path: home_path
  link_title_en: Home
  link_title_es: Inicio
  placement: top_nav
  sort_order: 1
  visible: true

- slug: top_nav_buy
  page_slug: buy
  link_path: buy_path
  link_title_en: Buy
  link_title_es: Comprar
  placement: top_nav
  sort_order: 2
  visible: true

- slug: top_nav_rent
  page_slug: rent
  link_path: rent_path
  link_title_en: Rent
  link_title_es: Arrendar
  placement: top_nav
  sort_order: 3
  visible: true

- slug: top_nav_about
  page_slug: about-us
  link_path: show_page_path
  link_path_params: about-us
  link_title_en: About
  link_title_es: Sobre Nosotros
  placement: top_nav
  sort_order: 4
  visible: true

- slug: top_nav_contact
  page_slug: contact-us
  link_path: contact_us_path
  link_title_en: Contact
  link_title_es: Contacto
  placement: top_nav
  sort_order: 5
  visible: true

